# SAMPLE. Copy to $VARVE_DATA/runtimes.toml and edit. One [[row]] per agent runtime.
#   name     runtime column value and mirror folder
#   adapter  file in adapters/ (the data home's adapters/ wins)
#   source   where the runtime keeps its sessions
#   include  find -name allow-list; nothing else is retained
#   replace  optional; files kept as zstd frames, together or not at all, because
#            a stale database and journal pair corrupts. Every other include file
#            is retained as lines of a Parquet table.

[[row]]
name = "claude-code"
adapter = "claude_code.sql"
source = "~/.claude/projects"
include = ["*.jsonl"]

[[row]]
name = "pi"
adapter = "pi.sql"
source = "~/.pi/agent/sessions"
include = ["*.jsonl"]

[[row]]
name = "opencode"
adapter = "opencode.sql"
source = "~/.local/share/opencode"
include = ["opencode.db", "opencode.db-wal"]
replace = ["opencode.db", "opencode.db-wal"]
