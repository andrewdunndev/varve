<svg viewBox="0 0 1200 430" width="1200" height="430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="varve hero: read the layers a harness lays down.">
  <rect x="0" y="0" width="1200" height="430" fill="#f4f4f4"/>
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <text x="60" y="34" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">AGENT SESSION LAKE · PARQUET + DUCKDB · LOCAL ONLY</text>
  <text x="1140" y="34" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">2026</text>
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="138" font-size="72" font-weight="700" fill="#4a6741" letter-spacing="-2">varve</text>
  <text x="60" y="172" font-size="14" fill="#404040">normalizes on-disk agent-session records into a queryable local lake</text>
  <text x="60" y="192" font-size="14" fill="#404040">Claude Code, pi, opencode. Files canonical, the engine disposable</text>
  <text x="60" y="222" font-size="12" font-style="italic" fill="#404040">zero listeners, zero egress</text>
  <g transform="translate(110 240) scale(2.2)">
  <g stroke="#4a6741" fill="none" stroke-linecap="round">
    <rect x="20" y="8" width="26" height="48" rx="3" stroke-width="2"/>
    <line x1="20" y1="18" x2="46" y2="18" stroke-width="1.6"/>
    <line x1="20" y1="27" x2="46" y2="27" stroke-width="1.6"/>
    <line x1="20" y1="33" x2="46" y2="33" stroke-width="1.6"/>
    <line x1="20" y1="44" x2="46" y2="44" stroke-width="1.6"/>
    <line x1="12" y1="18" x2="16" y2="18" stroke-width="1.6"/>
    <line x1="12" y1="33" x2="16" y2="33" stroke-width="1.6"/>
    <line x1="12" y1="44" x2="16" y2="44" stroke-width="1.6"/>
  </g>
  <rect x="21" y="21" width="24" height="3.5" fill="#4a6741"/>
  <rect x="21" y="47" width="24" height="3.5" fill="#4a6741"/>
  </g>
  <text x="560" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">FLOW</text>
  <text x="850" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DISCIPLINE</text>
  <rect x="560" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">IN</text>
  <text x="578" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">transcripts</text>
  <text x="578" y="178" font-size="11" fill="#404040">on-disk session records from three runtimes</text>
  <text x="578" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">CLAUDE CODE · PI · OPENCODE</text>
  <rect x="850" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">POSTURE</text>
  <text x="868" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">local lake</text>
  <text x="868" y="178" font-size="11" fill="#404040">Parquet partitions, DuckDB views, no server</text>
  <text x="868" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">FILES CANONICAL · ZERO EGRESS</text>
  <rect x="560" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OUT</text>
  <text x="578" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">signal</text>
  <text x="578" y="318" font-size="11" fill="#404040">cost analytics, corrections, counterfactuals</text>
  <text x="578" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">VERSIONED SQL LIBRARY</text>
  <rect x="850" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">LIFETIME</text>
  <text x="868" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">longitudinal</text>
  <text x="868" y="318" font-size="11" fill="#404040">keep everything, the record is the asset</text>
  <text x="868" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">NO TTL · DISK WATCH 100 GB</text>
  <line x1="60" y1="386" x2="1140" y2="386" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="412" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">MIT · THE INSTRUMENT IS PUBLIC, THE READINGS ARE NOT</text>
  <text x="1140" y="412" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">GITLAB.COM/DUNN.DEV/VARVE</text>
  </g>
</svg>
