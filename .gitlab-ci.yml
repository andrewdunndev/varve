# .gitlab-ci.yml -- merge-gate pipeline that actually validates the repo
#
# Replaces the loud no_ci_see_deviations_yaml placeholder (main@625de0a):
# that job asserted nothing about this repo, only that a merge-gate deviation
# was on file. varve is SQL + a justfile, not a language stack any dunn.dev/
# pipeline catalog component targets (go/rust/node/container), so this hand-
# rolls two jobs that call the justfile's own `lint`/`test` recipes -- CI
# duplicates none of their logic, so `just test` still runs identically on the
# operator's machine.
#
# `lint`  -- just --evaluate (a broken interpolation or malformed recipe fails
#            the parse; deliberately not `just --fmt --check`, whose canonical
#            reformat would flatten this file's intentional `:=` alignment --
#            a style opinion, not a defect).
# `test`  -- the real assertion. mise install resolves the pinned duckdb/just
#            (mise.toml validated for free -- a bad pin fails before any
#            recipe runs), then `just test` runs the full backfill/mine
#            pipeline against a synthetic three-runtime fixture
#            (tests/fixtures/) in an isolated VARVE_DATA, so every statement in
#            adapters/*.sql and sql/*.sql executes for real against DuckDB
#            (the actual engine -- not a generic SQL linter that would
#            disagree with its dialect), then executes every file in
#            queries/*.sql plus `just review` against the result. See the
#            justfile `test` recipe for the full rationale.
#
# Runner: untagged GitLab SaaS shared runner (dunn.dev/pipeline README v2.2.0+
# posture -- the previous self-hosted-runner constraint is opt-in only for
# demonstrably heavy jobs; this one just downloads duckdb/just and runs SQL).

default:
  interruptible: true

stages:
  - lint
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# mise provisions duckdb + just from mise.toml. Entrypoint override clears the
# image's default `mise shell` ENTRYPOINT so GitLab Runner's `bash -c
# "<script>"` invocation works (same shape as dunn.dev/cv's typst-job).
.mise-job: &mise-job
  image:
    name: jdxcode/mise:debian@sha256:ac140bcb5d4a989d3f66eb651263915154c33fa65134d63db4f7edf110ce87cc
    entrypoint: [""]
  before_script:
    - mise install
    - eval "$(mise activate bash)"

lint:
  <<: *mise-job
  stage: lint
  script:
    - just lint

test:
  <<: *mise-job
  stage: test
  script:
    - just test
