# Merge gate. Both jobs call the justfile recipes, so CI and a local run match.
# Hand-rolled: varve is SQL + a justfile, not a language stack a dunn.dev/pipeline catalog component targets.
# lint: justfile parses, scripts parse, no engine name outside bin/duck.
# test: just test runs the pipeline on the synthetic fixture under an isolated
#       VARVE_DATA and executes every SQL file against the engine.
# Runs on the untagged shared runner. The jobs only fetch the pinned tools.

default:
  interruptible: true

stages:
  - lint
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# mise provisions the pinned tools from mise.toml. Entrypoint override clears the
# image's default `mise shell` ENTRYPOINT so GitLab Runner's `bash -c
# "<script>"` invocation works.
.mise-job: &mise-job
  image:
    name: jdxcode/mise:debian@sha256:84bb97455fe918f3b805520f9a7b1fd3060085a4ccc757a3ab17fa2e946df46e
    entrypoint: [""]
  before_script:
    - mise install
    - eval "$(mise activate bash)"

lint:
  <<: *mise-job
  stage: lint
  script:
    - just lint

test:
  <<: *mise-job
  stage: test
  script:
    - just test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - golden-out/
