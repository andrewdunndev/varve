<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="env-t">
  <title id="env-t">Sync runs outside the bin/duck boundary. Every DuckDB process runs inside it under memory, thread, spill, time and lock limits.</title>
    <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #f4f4f4; stroke: #c4c4c4; stroke-width: 1; }
    .acc { fill: #4a6741; stroke: #4a6741; }
    .dim { fill: none; stroke: #c4c4c4; stroke-width: 1; stroke-dasharray: 5 4; }
    .zone { fill: none; stroke: #4a6741; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .nm { font-size: 14px; font-weight: 600; fill: #0a0a0a; }
    .sub { font-size: 12px; fill: #707070; }
    .lbl { font-size: 12px; fill: #404040; }
    .anm { font-size: 14px; font-weight: 600; fill: #ffffff; }
    .asub { font-size: 12px; fill: #ffffff; }
    .gnm { font-size: 14px; font-weight: 600; fill: #707070; }
    .ln { fill: none; stroke: #404040; stroke-width: 1.5; }
    .ah { fill: #404040; }
    .zl { font-size: 12px; font-weight: 600; fill: #4a6741; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #242426; stroke: #48484a; }
      .acc { fill: #6aaa58; stroke: #6aaa58; }
      .dim { stroke: #48484a; }
      .zone { stroke: #6aaa58; }
      .nm { fill: #f2f2f7; }
      .sub { fill: #8e8e93; }
      .lbl { fill: #aeaeb2; }
      .anm { fill: #1c1c1e; }
      .asub { fill: #1c1c1e; }
      .gnm { fill: #8e8e93; }
      .ln { stroke: #aeaeb2; }
      .ah { fill: #aeaeb2; }
      .zl { fill: #6aaa58; }
    }
  </style>
  <defs><marker id="env-ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path class="ah" d="M0,0 L10,4 L0,8 Z"/></marker></defs>
  <rect class="zone" x="180" y="20" width="660" height="340" rx="8"/>
  <text class="zl" x="200" y="44">bin/duck</text>
  <text class="sub" x="270" y="44">memory, threads, spill, time, lock</text>
  <path class="ln" d="M140,180 H200" marker-end="url(#env-ar)"/>
  <path class="ln" d="M380,180 H440" marker-end="url(#env-ar)"/>
  <path class="ln" d="M540,180 H600" marker-end="url(#env-ar)"/>
  <path class="ln" d="M680,180 H740" marker-end="url(#env-ar)"/>
  <path class="ln" d="M140,322 H240" marker-end="url(#env-ar)"/>
  <text class="lbl" x="160" y="170" text-anchor="middle">files</text>
  <text class="lbl" x="410" y="170" text-anchor="middle">write</text>
  <text class="lbl" x="570" y="170" text-anchor="middle">read</text>
  <text class="lbl" x="710" y="170" text-anchor="middle">rows</text>
  <text class="lbl" x="212" y="312" text-anchor="middle">read</text>
  <rect class="box" x="20" y="150" width="120" height="60" rx="6"/>
  <text class="nm" x="80" y="186" text-anchor="middle">sync</text>
  <text class="sub" x="80" y="230" text-anchor="middle">never opens DuckDB</text>
  <rect class="box" x="200" y="70" width="180" height="190" rx="6"/>
  <text class="nm" x="290" y="94" text-anchor="middle">build</text>
  <rect class="dim" x="212" y="110" width="156" height="40" rx="4"/>
  <text class="lbl" x="290" y="135" text-anchor="middle">process: runtime A</text>
  <rect class="dim" x="212" y="160" width="156" height="40" rx="4"/>
  <text class="lbl" x="290" y="185" text-anchor="middle">process: runtime B</text>
  <rect class="dim" x="212" y="210" width="156" height="40" rx="4"/>
  <text class="lbl" x="290" y="235" text-anchor="middle">process: runtime C</text>
  <rect class="box" x="440" y="150" width="100" height="60" rx="6"/>
  <text class="nm" x="490" y="186" text-anchor="middle">lake.new</text>
  <rect class="box" x="600" y="150" width="80" height="60" rx="6"/>
  <text class="nm" x="640" y="186" text-anchor="middle">mine</text>
