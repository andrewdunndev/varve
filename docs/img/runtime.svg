<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="rt-t">
  <title id="rt-t">A new runtime adds an adapter file, a fixture directory, and one runtimes row. The adapter and the runtimes row can stay in your data home with no PR. The shared files are not touched.</title>
    <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #f4f4f4; stroke: #c4c4c4; stroke-width: 1; }
    .acc { fill: #4a6741; stroke: #4a6741; }
    .dim { fill: none; stroke: #c4c4c4; stroke-width: 1; stroke-dasharray: 5 4; }
    .zone { fill: none; stroke: #4a6741; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .nm { font-size: 14px; font-weight: 600; fill: #0a0a0a; }
    .sub { font-size: 12px; fill: #707070; }
    .lbl { font-size: 12px; fill: #404040; }
    .anm { font-size: 14px; font-weight: 600; fill: #ffffff; }
    .asub { font-size: 12px; fill: #ffffff; }
    .gnm { font-size: 14px; font-weight: 600; fill: #707070; }
    .ln { fill: none; stroke: #404040; stroke-width: 1.5; }
    .ah { fill: #404040; }
    .zl { font-size: 12px; font-weight: 600; fill: #4a6741; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #242426; stroke: #48484a; }
      .acc { fill: #6aaa58; stroke: #6aaa58; }
      .dim { stroke: #48484a; }
      .zone { stroke: #6aaa58; }
      .nm { fill: #f2f2f7; }
      .sub { fill: #8e8e93; }
      .lbl { fill: #aeaeb2; }
      .anm { fill: #1c1c1e; }
      .asub { fill: #1c1c1e; }
      .gnm { fill: #8e8e93; }
      .ln { stroke: #aeaeb2; }
      .ah { fill: #aeaeb2; }
      .zl { fill: #6aaa58; }
    }
  </style>
  <defs><marker id="rt-ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path class="ah" d="M0,0 L10,4 L0,8 Z"/></marker></defs>
  <text class="zl" x="400" y="26" text-anchor="middle">touched</text>
  <text class="sub" x="720" y="26" text-anchor="middle">shared, not touched</text>
  <path class="ln" d="M160,72 H260" marker-end="url(#rt-ar)"/>
  <path class="ln" d="M160,152 H260" marker-end="url(#rt-ar)"/>
  <path class="ln" d="M160,232 H260" marker-end="url(#rt-ar)"/>
  <text class="lbl" x="210" y="62" text-anchor="middle">adds</text>
  <text class="lbl" x="210" y="142" text-anchor="middle">adds</text>
  <text class="lbl" x="210" y="222" text-anchor="middle">adds</text>
  <rect class="box" x="20" y="44" width="140" height="216" rx="6"/>
  <text class="nm" x="90" y="148" text-anchor="middle">new</text>
  <text class="nm" x="90" y="166" text-anchor="middle">runtime</text>
  <rect class="acc" x="260" y="44" width="280" height="56" rx="6"/>
  <text class="anm" x="400" y="68" text-anchor="middle">adapters/&lt;rt&gt;.sql</text>
  <text class="asub" x="400" y="86" text-anchor="middle">one adapter file</text>
  <rect class="acc" x="260" y="124" width="280" height="56" rx="6"/>
  <text class="anm" x="400" y="148" text-anchor="middle">tests/fixtures/&lt;rt&gt;/</text>
  <text class="asub" x="400" y="166" text-anchor="middle">one fixture</text>
  <rect class="acc" x="260" y="204" width="280" height="56" rx="6"/>
  <text class="anm" x="400" y="228" text-anchor="middle">one runtimes row</text>
  <text class="asub" x="400" y="246" text-anchor="middle">runtimes.example.toml in the repo</text>
  <rect class="dim" x="600" y="44" width="240" height="44" rx="6"/>
  <text class="gnm" x="720" y="72" text-anchor="middle">justfile</text>
  <rect class="dim" x="600" y="108" width="240" height="44" rx="6"/>
  <text class="gnm" x="720" y="136" text-anchor="middle">mining/corrections.sql</text>
  <rect class="dim" x="600" y="172" width="240" height="44" rx="6"/>
  <text class="gnm" x="720" y="200" text-anchor="middle">queries/</text>
  <rect class="dim" x="600" y="236" width="240" height="44" rx="6"/>
  <text class="gnm" x="720" y="264" text-anchor="middle">other adapters</text>
  <text class="lbl" x="400" y="284" text-anchor="middle">Adapter and runtimes row can stay in your data home, no PR</text>
</svg>
