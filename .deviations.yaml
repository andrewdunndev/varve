# Declared exceptions to estate standards, read by the estate's
# conformance checks: a matching FAIL reports as WAIVED, never a
# silent PASS. Entries need a reason and an owner.
- standard: repository
  assertion: "gitlab:only_allow_merge_if_pipeline_succeeds"
  reason: >-
    Covered by the dunn.dev group-level cascade (group 13121531 sets
    only_allow_merge_if_pipeline_succeeds=true), which outranks the
    project flag; flipping the project copy would be redundant state.
  owner: andrew@dunn.dev
- standard: pipeline
  assertion: "file-contains:.gitlab-ci.yml"
  reason: >-
    Hand-rolled two-job gate: varve is SQL plus a justfile, not a language
    stack any dunn.dev/pipeline catalog component targets. Both jobs call
    the justfile recipes, so CI and a local run match.
  owner: andrew@dunn.dev
